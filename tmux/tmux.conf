#monochrome
set -g mouse on
set -g status-position top
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 10000
set -g escape-time 0
set -g default-terminal "tmux-256color"

##### truecolor #####
set -as terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-features ",xterm-256color:RGB"

##### status bar #####
set -g status-style "bg=#000000,fg=#d9d9d9"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-interval 1

##### left #####
set -g status-left "#[fg=#bfbfbf,bold]_#[fg=#e5e5e5,bold]#S #[fg=#4d4d4d]│"

##### windows #####
setw -g window-status-separator ""

# inactive
set -g window-status-format \
"#[fg=#8c8c8c,bg=#000000]  #[fg=#b3b3b3]#I #[fg=#d9d9d9]#W "

# active
set -g window-status-current-format \
"#[fg=#000000,bg=#d9d9d9,bold] ◉ #[fg=#000000,bold]#I #W "

##### right #####
set -g status-right "\
#[fg=#4d4d4d] \
#[fg=#bfbfbf]󰉋 #(basename #{pane_current_path}) \
#[fg=#4d4d4d]│ \
#[fg=#e5e5e5]󱑆 %H:%M %p "

##### pane borders #####
set -g pane-border-style "fg=#2e2e2e"
set -g pane-active-border-style "fg=#d9d9d9"

##### pane styles #####
set -g display-panes-active-colour "#d9d9d9"
set -g display-panes-colour "#8c8c8c"

##### messages #####
set -g message-style "bg=#121212,fg=#e5e5e5"
set -g message-command-style "bg=#121212,fg=#d9d9d9"

##### copy mode #####
setw -g mode-style "bg=#d9d9d9,fg=#000000,bold"

##### clock #####
set -g clock-mode-colour "#d9d9d9"

##### popup #####
set -g popup-style "bg=#000000,fg=#e5e5e5"
set -g popup-border-style "fg=#d9d9d9"

##### splits #####
bind | split-window -h
bind - split-window -v

##### vim motions #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### resizing #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind x kill-pane

##### cleaner look #####
set -g pane-border-status off
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

##### better navigation #####
setw -g automatic-rename on
set -g renumber-windows on

##### terminal title #####
set -g set-titles on
set -g set-titles-string "tmux :: #S"

##### optional blur aesthetic #####
set -g status-style default
